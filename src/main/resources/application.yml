server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service-route
          uri: https://user-service-jkxh.onrender.com
          predicates:
            - Path=/users/**

        - id: order-service-route
          uri: https://order-service-lnpa.onrender.com
          predicates:
            - Path=/orders/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG